# One genome config for both modes, so lap-time training can resume from a
# curriculum checkpoint. 15 inputs and 2 outputs are fixed by rules solo-1.
[NEAT]
fitness_criterion      = max
fitness_threshold      = 1e12
pop_size               = 150
reset_on_extinction    = False
no_fitness_termination = True

[DefaultGenome]
num_inputs              = 15
num_outputs             = 2
num_hidden              = 0
feed_forward            = True
initial_connection      = full_direct

# tanh only: neat-python can't restrict outputs separately, and an output that
# mutates to sigmoid or relu can never go negative, so the car can never brake
# (the first runs found exactly that and coasted at 1% throttle).
activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh

aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

conn_add_prob           = 0.3
conn_delete_prob        = 0.12
node_add_prob           = 0.08
node_delete_prob        = 0.05

enabled_default         = True
enabled_mutate_rate     = 0.01

bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.4
bias_mutate_rate        = 0.6
bias_replace_rate       = 0.05

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.4
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.05

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 25
species_elitism      = 3

[DefaultReproduction]
elitism            = 3
survival_threshold = 0.2
