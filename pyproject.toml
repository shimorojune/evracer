[project]
name = "fevo-racer1"
version = "0.1.0"
description = "fevo-racer1: NEAT agents that learn real F1 circuits on the fevo simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cma>=4.5.0",
    "fevo",
    "neat-python>=2.0.0",
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[project.scripts]
train-curriculum = "fevoracer.cli:train_curriculum"
train-laptime = "fevoracer.cli:train_laptime"
tune-laptime = "fevoracer.cli:tune_laptime"
train-ppo = "fevoracer.cli:train_ppo"
warm-start = "fevoracer.cli:warm_start"
practice = "fevoracer.cli:practice"
smooth-inputs = "fevoracer.cli:smooth_inputs"
smooth-compare = "fevoracer.smooth:compare"
benchmark-lap = "fevoracer.cli:benchmark"
export-winner = "fevoracer.cli:export"
replay = "fevoracer.cli:replay"
watch = "fevoracer.watch:main"

[tool.uv.sources]
# The fevo SDK from the fevo monorepo next door: same sim.wasm as the website.
fevo = { path = "../fevo/python/fevo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fevoracer"]

[tool.uv]
package = true
